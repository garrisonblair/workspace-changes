name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Manifest in sync with src/gitMenu.js
        run: node scripts/gen-manifest.js --check
      - name: Extension tests
        run: node test/run.js
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Webview tests (headless Chromium)
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
          python test/webview_test.py "$RUNNER_TEMP"
      - name: Package
        run: npx --yes @vscode/vsce@4.0.0 package
      - uses: actions/upload-artifact@v5
        with:
          name: vsix
          path: '*.vsix'
