# Automatic releases.
#
# When a push to main changes the "version" in package.json (i.e. there is no v<version> tag yet),
# this workflow tests and packages the extension, publishes it, then creates the v<version> tag and
# a GitHub Release with the .vsix. Re-running it for an already released version does nothing.
#
# - Open VSX (Cursor, VSCodium, ...): trusted publishing (OIDC), no token. The trusted publisher
#   registered on open-vsx.org must point at this repository and this file: release.yml.
# - VS Code Marketplace: off until the repository variable VSCE_PUBLISH is "true" (needs a Trusted
#   Publishing policy for this repo + release.yml on marketplace.visualstudio.com/manage).
#
# To release: bump "version" in package.json, add a CHANGELOG.md entry, push to main.
name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # create the tag and the GitHub Release
  id-token: write   # OIDC token for trusted publishing

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # tags, to see whether this version was released already

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Version to release
        id: version
        run: |
          v=$(node -p "require('./package.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$v" >/dev/null; then
            echo "v$v is already released, nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Releasing v$v"
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Test
        if: steps.version.outputs.release == 'true'
        run: |
          node scripts/gen-manifest.js --check
          node test/run.js

      - name: Package
        if: steps.version.outputs.release == 'true'
        run: npx --yes @vscode/vsce@4.0.0 package -o workspace-changes.vsix

      - name: Publish to Open VSX (trusted publishing)
        if: steps.version.outputs.release == 'true'
        run: npx --yes ovsx@1.3.0 publish workspace-changes.vsix --trusted-publishing --skip-duplicate

      - name: Publish to VS Code Marketplace
        if: steps.version.outputs.release == 'true' && vars.VSCE_PUBLISH == 'true'
        run: npx --yes @vscode/vsce@4.0.0 publish --oidc --packagePath workspace-changes.vsix --skip-duplicate

      - name: Tag and GitHub Release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.version.outputs.version }}
        run: |
          # release notes = this version's CHANGELOG.md section
          awk -v v="## $V" '$0 == v {on=1; next} /^## / && on {exit} on' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md" > notes.md
          gh release create "v$V" workspace-changes.vsix --target "$GITHUB_SHA" --title "v$V" --notes-file notes.md
